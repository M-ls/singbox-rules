name: Sync streaming rules

on:
  schedule:
    - cron: '25 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: streaming-upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Download pinned sing-box compiler
        shell: bash
        run: |
          mkdir -p .work
          curl -fL --retry 3 -o .work/sing-box.tar.gz \
            https://github.com/SagerNet/sing-box/releases/download/v1.14.2/sing-box-1.14.2-linux-amd64.tar.gz
          echo 'a684484d7477d1437282ee411f4d131d0340aaad60a7868841ebd5d87dd8a0c6  .work/sing-box.tar.gz' | sha256sum -c -
          tar -xzf .work/sing-box.tar.gz -C .work
      - name: Merge upstream rules and compile
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/sync.mjs --sing-box .work/sing-box-1.14.2-linux-amd64/sing-box
      - name: Commit updated rules
        if: github.repository == 'M-ls/singbox-rules'
        shell: bash
        run: |
          git add -- rules/streaming.json rules/streaming.srs sources.lock.json
          if git diff --cached --quiet; then
            echo 'Streaming rules are unchanged.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Sync streaming rules from upstream'
          git push origin HEAD:main
